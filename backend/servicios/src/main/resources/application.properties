spring.application.name=servicios
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida_servicios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:data/migration

springdoc.swagger-ui.path=/swagger-ui.html
