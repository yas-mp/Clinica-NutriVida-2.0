server.port=8086
spring.application.name=ms-pago

spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida_pago?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:data/migration
spring.flyway.encoding=UTF-8

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Integración con el microservicio de usuarios
pago.usuarios.url=${PAGO_USUARIOS_URL:http://localhost:8081}
pago.usuarios.connect-timeout-ms=2000
pago.usuarios.read-timeout-ms=3000
# Si el servicio de usuarios no responde, el pago se registra igual y se deja constancia en el log.
pago.usuarios.fallar-si-no-responde=false
